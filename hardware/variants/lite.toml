# OpenDAP T1 main board: variant "lite"
#
# Format: opendap.board-variant/v1, defined in docs/specs/feature-blocks.md §4.
# Every block of the catalog appears exactly once under [blocks]. KiCad's
# variant data, the BOM, pick-and-place, devicetree overlays and the device
# description are generated from this file (RFC 0011 rule 7); nothing is
# edited by hand per variant.
#
# PROPOSAL ONLY. Not decided by the maintainers. Every dnp below is a
# candidate: whether it moves the price materially (BRD-053 rule, about 1 %
# of the production BOM each) needs the production BOM total, which the BOM
# does not carry. The audio chain and every must block stay fitted
# (RFC 0011 rule 5). Prices are BOM v1.7 qty-1 figures.

schema = "opendap.board-variant/v1"
board = "t1-main-board"
name = "lite"
kind = "lite"
status = "proposed"
description = "Proposal: a lower-cost T1 with should blocks left off where they move the price materially; the audio chain unchanged."
target_level = "Q1"
catalog = "docs/specs/feature-blocks.md"
promise = [
  "T1-040", "T1-004", "T1-049", "T1-072",
  "BRD-003", "BRD-011", "BRD-012", "BRD-018", "BRD-022", "BRD-023", "BRD-024",
  "BRD-026", "BRD-027", "BRD-029", "BRD-034", "BRD-037", "BRD-038", "BRD-040",
  "BRD-044", "BRD-045", "BRD-048", "BRD-049", "BRD-050", "BRD-051", "BRD-052",
]

[instrumentation]
links = "zero-ohm"
test_points = "fit"

[blocks]
